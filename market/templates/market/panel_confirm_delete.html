{% extends "market/base.html" %}
{% block title %}ዝርዝር አስወግድ{% endblock %}
{% block content %}
{% include "market/_panel_nav.html" %}
<section class="section">
  <div class="narrow">
    <div class="card pad">
      <h1 style="font-size:1.6rem">ይህን ዝርዝር ያስወግዱ?</h1>
      <p><b>{{ listing.title }}</b> ከድረ-ገጹ ላይ ለዘላለም ይወገዳል። ለጊዜው ብቻ ለመደበቅ ከፈለጉ «አስተካክል» ውስጥ «በድረ-ገጹ ላይ ይታይ» ን ያጥፉ።</p>
      <form method="post" class="row">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">አዎ፣ አስወግድ</button>
        <a class="btn btn-ghost" href="{% url 'panel_listings' %}">ተው</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
