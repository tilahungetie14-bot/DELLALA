{% extends "market/base.html" %}
{% block title %}ግባ{% endblock %}
{% block content %}
<section class="section">
  <div class="narrow">
    <div class="card pad">
      <h1 style="font-size:1.8rem">ወደ አካውንትዎ ይግቡ</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
        {% for field in form %}{% include "market/_field.html" %}{% endfor %}
        <button class="btn btn-dark btn-block" type="submit">ግባ</button>
      </form>
      <p class="small muted" style="margin:1.2rem 0 0">አዲስ ነዎት? <a href="{% url 'register' %}">አካውንት ይክፈቱ</a></p>
    </div>
  </div>
</section>
{% endblock %}
