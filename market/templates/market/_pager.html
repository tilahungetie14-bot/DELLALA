{% if page.has_other_pages %}
<nav class="pager" aria-label="ገጽ">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">ቀዳሚ</a>{% endif %}
  <span class="muted small">ገጽ {{ page.number }} ከ {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">ቀጣይ</a>{% endif %}
</nav>
{% endif %}
